<!-- Hero Banner -->
<section class="hero-banner">
  <div class="container">
    <h1>Available Positions</h1>
    <p>Find the right opportunity that matches your skills</p>
  </div>
</section>

<!-- Search Section -->
<section class="search-section">
  <div class="container">
    <div class="row g-3 align-items-end">
      <div class="col-md-5">
        <label class="form-label fw-semibold">Keyword</label>
        <input
          type="text"
          class="form-control"
          placeholder="Search by title or department..."
          [(ngModel)]="searchKeyword"
          (keyup.enter)="onSearch()"
        />
      </div>
      <div class="col-md-4">
        <label class="form-label fw-semibold">Location</label>
        <select class="form-select" [(ngModel)]="selectedLocation">
          <option value="">All Locations</option>
          <option *ngFor="let loc of locations" [value]="loc">{{ loc }}</option>
        </select>
      </div>
      <div class="col-md-3">
        <button class="btn btn-primary-brand w-100" (click)="onSearch()">
          <i class="bi bi-search me-1"></i> Search
        </button>
      </div>
    </div>
  </div>
</section>

<!-- Job Cards -->
<section class="jobs-section">
  <div class="container">
    <div class="row g-4">
      <div class="col-md-6 col-lg-4" *ngFor="let job of filteredJobs">
        <div class="card job-card h-100">
          <div class="card-body d-flex flex-column">
            <h5 class="card-title mb-2">{{ job.title }}</h5>
            <div class="mb-2">
              <span class="badge badge-department me-2">{{ job.department }}</span>
              <span
                class="badge"
                [ngClass]="job.type === 'Full-time' ? 'badge-fulltime' : 'badge-parttime'"
              >
                {{ job.type }}
              </span>
            </div>
            <p class="location-text mb-1">
              <i class="bi bi-geo-alt-fill me-1"></i>{{ job.location }}
            </p>
            <p class="posted-date mb-3">
              <i class="bi bi-calendar3 me-1"></i>Posted: {{ job.postedDate | date:'mediumDate' }}
            </p>
            <div class="mt-auto">
              <a class="btn btn-apply w-100" [routerLink]="'/jobs/' + job.id">
                Apply Now
              </a>
            </div>
          </div>
        </div>
      </div>
    </div>

    <div *ngIf="filteredJobs.length === 0" class="text-center py-5">
      <p class="text-muted fs-5">No jobs match your search criteria.</p>
    </div>
  </div>
</section>
