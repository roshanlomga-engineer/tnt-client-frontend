<div class="container mt-5">
  <div class="card auth-card mx-auto shadow">
    <div class="card-header text-center py-3">
      <h4 class="mb-0">Create Account</h4>
    </div>
    <div class="card-body p-4">
      <form [formGroup]="registerForm" (ngSubmit)="onSubmit()">
        <div class="mb-3">
          <label for="fullName" class="form-label">Full Name</label>
          <input type="text" id="fullName" class="form-control" formControlName="fullName" placeholder="Enter your full name" />
          <div *ngIf="registerForm.get('fullName')?.touched && registerForm.get('fullName')?.invalid" class="text-danger small mt-1">
            <span *ngIf="registerForm.get('fullName')?.errors?.['required']">Full name is required.</span>
          </div>
        </div>

        <div class="mb-3">
          <label for="email" class="form-label">Email</label>
          <input type="email" id="email" class="form-control" formControlName="email" placeholder="Enter your email" />
          <div *ngIf="registerForm.get('email')?.touched && registerForm.get('email')?.invalid" class="text-danger small mt-1">
            <span *ngIf="registerForm.get('email')?.errors?.['required']">Email is required.</span>
            <span *ngIf="registerForm.get('email')?.errors?.['email']">Please enter a valid email.</span>
          </div>
        </div>

        <div class="mb-3">
          <label for="phone" class="form-label">Phone</label>
          <input type="tel" id="phone" class="form-control" formControlName="phone" placeholder="Enter your phone number" />
          <div *ngIf="registerForm.get('phone')?.touched && registerForm.get('phone')?.invalid" class="text-danger small mt-1">
            <span *ngIf="registerForm.get('phone')?.errors?.['required']">Phone number is required.</span>
          </div>
        </div>

        <div class="mb-3">
          <label for="password" class="form-label">Password</label>
          <input type="password" id="password" class="form-control" formControlName="password" placeholder="Enter your password" />
          <div *ngIf="registerForm.get('password')?.touched && registerForm.get('password')?.invalid" class="text-danger small mt-1">
            <span *ngIf="registerForm.get('password')?.errors?.['required']">Password is required.</span>
            <span *ngIf="registerForm.get('password')?.errors?.['minlength']">Password must be at least 6 characters.</span>
          </div>
        </div>

        <div class="mb-3">
          <label for="confirmPassword" class="form-label">Confirm Password</label>
          <input type="password" id="confirmPassword" class="form-control" formControlName="confirmPassword" placeholder="Confirm your password" />
          <div *ngIf="registerForm.get('confirmPassword')?.touched && registerForm.get('confirmPassword')?.invalid" class="text-danger small mt-1">
            <span *ngIf="registerForm.get('confirmPassword')?.errors?.['required']">Please confirm your password.</span>
          </div>
        </div>

        <div class="mb-3">
          <label class="form-label">Role</label>
          <select class="form-select" formControlName="role">
            <option value="Candidate">Candidate</option>
          </select>
        </div>

        <button type="submit" class="btn btn-gold w-100 mb-3">Create Account</button>
      </form>

      <div class="text-center">
        <p class="mb-0">
          Already have an account? <a routerLink="/auth/login">Sign In</a>
        </p>
      </div>
    </div>
  </div>
</div>
