<div class="container mt-5">
  <div class="card auth-card mx-auto shadow">
    <div class="card-header text-center py-3">
      <h4 class="mb-0">Sign In</h4>
    </div>
    <div class="card-body p-4">
      <form [formGroup]="loginForm" (ngSubmit)="onSubmit()">
        <div class="mb-3">
          <label for="email" class="form-label">Email</label>
          <input type="email" id="email" class="form-control" formControlName="email" placeholder="Enter your email" />
          <div *ngIf="loginForm.get('email')?.touched && loginForm.get('email')?.invalid" class="text-danger small mt-1">
            <span *ngIf="loginForm.get('email')?.errors?.['required']">Email is required.</span>
            <span *ngIf="loginForm.get('email')?.errors?.['email']">Please enter a valid email.</span>
          </div>
        </div>

        <div class="mb-3">
          <label for="password" class="form-label">Password</label>
          <input type="password" id="password" class="form-control" formControlName="password" placeholder="Enter your password" />
          <div *ngIf="loginForm.get('password')?.touched && loginForm.get('password')?.invalid" class="text-danger small mt-1">
            <span *ngIf="loginForm.get('password')?.errors?.['required']">Password is required.</span>
            <span *ngIf="loginForm.get('password')?.errors?.['minlength']">Password must be at least 6 characters.</span>
          </div>
        </div>

        <button type="submit" class="btn btn-gold w-100 mb-3">Sign In</button>
      </form>

      <div class="text-center">
        <p class="mb-1">
          Don't have an account? <a routerLink="/auth/register">Register</a>
        </p>
        <p class="mb-0">
          <a href="javascript:void(0)">Forgot password?</a>
        </p>
      </div>
    </div>
  </div>
</div>
