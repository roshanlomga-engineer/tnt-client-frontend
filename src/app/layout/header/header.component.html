<nav class="navbar navbar-expand-lg navbar-light bg-white fixed-top" [class.scrolled]="isScrolled">
  <div class="container">
    <a class="navbar-brand" routerLink="/">
      <div>
        <div class="brand-logo">T&amp;T</div>
        <div class="brand-tagline">Manpower Services</div>
      </div>
    </a>

    <button
      class="navbar-toggler"
      type="button"
      (click)="toggleMenu()"
      [attr.aria-expanded]="!isMenuCollapsed"
      aria-controls="navbarNav"
      aria-label="Toggle navigation">
      <span class="navbar-toggler-icon"></span>
    </button>

    <div class="collapse navbar-collapse" [class.show]="!isMenuCollapsed" id="navbarNav">
      <ul class="navbar-nav ms-auto align-items-center gap-1">
        <li class="nav-item" *ngFor="let link of navLinks">
          <a
            class="nav-link"
            [routerLink]="link.path"
            routerLinkActive="active"
            [routerLinkActiveOptions]="{ exact: link.path === '/' }"
            (click)="isMenuCollapsed = true">
            {{ link.label }}
          </a>
        </li>
        <li class="nav-item ms-lg-2">
          <a class="btn btn-cta" routerLink="/get-started" (click)="isMenuCollapsed = true">
            Get Started
          </a>
        </li>
      </ul>
    </div>
  </div>
</nav>
